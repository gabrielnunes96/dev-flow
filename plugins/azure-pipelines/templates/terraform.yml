# Terraform: fmt/validate/plan em PR; apply só na branch base, por environment com aprovação.
# A credencial vem de uma service connection (workload identity) configurada pelo usuário.
trigger:
  branches:
    include: [main]
  paths:
    include: [infra/*]
pr:
  branches:
    include: [main]
  paths:
    include: [infra/*]

variables:
  pasta: infra/envs/dev

pool:
  vmImage: ubuntu-latest

stages:
  - stage: plano
    jobs:
      - job: plano
        steps:
          - script: terraform fmt -check -recursive infra
            displayName: fmt
          - script: terraform -chdir=$(pasta) init -input=false && terraform -chdir=$(pasta) validate
            displayName: init e validate
          - script: terraform -chdir=$(pasta) plan -input=false -out=plan.tfplan
            displayName: plan
          - publish: $(pasta)/plan.tfplan
            artifact: plano

  - stage: aplicar
    dependsOn: plano
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: aplicar
        environment: infra-dev # aprovação configurada no environment
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: plano
                - script: |
                    terraform -chdir=$(pasta) init -input=false
                    terraform -chdir=$(pasta) apply -input=false $(Pipeline.Workspace)/plano/plan.tfplan
                  displayName: apply
