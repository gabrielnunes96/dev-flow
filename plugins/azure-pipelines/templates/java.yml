# CI de um projeto Java/Spring (Maven wrapper). Para Gradle: ./gradlew build.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: "21"
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: Cache@2
    inputs:
      key: maven | "$(Agent.OS)" | **/pom.xml
      path: $(Pipeline.Workspace)/.m2
    displayName: Cache do Maven

  - script: ./mvnw -B verify
    displayName: Build e testes

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: "**/surefire-reports/TEST-*.xml"
